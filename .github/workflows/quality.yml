name: Quality checks

on:
  pull_request:
  push:
    branches: [main, feature/merkora-orchestration-v1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/merkora-npm-audit.json || true
          node -e 'const r=require("/tmp/merkora-npm-audit.json"); console.log("Dependency audit:", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | direct=" + item.isDirect + " | fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
