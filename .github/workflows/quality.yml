name: Quality checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit report
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || audit_status=$?
          node -e 'const r=require("./npm-audit.json"); console.log("AUDIT_SUMMARY", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log("AUDIT_PACKAGE", JSON.stringify({name, severity:item.severity, range:item.range, via:item.via, fixAvailable:item.fixAvailable, effects:item.effects}));'
          exit "${audit_status:-0}"
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Persist generated npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock npm dependency tree"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
