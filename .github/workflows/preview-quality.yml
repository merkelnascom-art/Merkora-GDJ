name: Preview branch quality checks

on:
  push:
    branches:
      - feature/admin-preview-secure-access
  pull_request:
    branches:
      - feature/admin-preview-secure-access

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities (no automatic fixes)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")); const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: (item.via || []).map((entry) => typeof entry === "string" ? entry : entry.title) })); console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, vulnerabilities }, null, 2));'
      - name: Run unit tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js app
        run: npm run build
