name: Create mission-ledger migration file

on:
  push:
    branches:
      - feature/merkora-multi-agent-org-catalog
    paths:
      - .migration-request

permissions:
  contents: write

jobs:
  create-migration:
    if: github.ref == 'refs/heads/feature/merkora-multi-agent-org-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the isolated implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Create the migration with the Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          migration_name="$(cat .migration-request)"
          test "$migration_name" = "factory_multi_agent_mission_ledger"
          supabase migration new "$migration_name"
      - name: Commit the CLI-generated timestamped migration scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "No new migration scaffold was generated."
            exit 1
          fi
          git commit -m "chore(db): scaffold mission ledger migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
