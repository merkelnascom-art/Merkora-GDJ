name: Factory mission ledger SQL checks

on:
  pull_request:
    paths:
      - supabase/migrations/*factory_multi_agent_mission_ledger.sql
      - supabase/tests/factory_mission_ledger.sql
      - .github/workflows/factory-mission-ledger-sql.yml
  push:
    branches:
      - feature/merkora-multi-agent-org-catalog
    paths:
      - supabase/migrations/*factory_multi_agent_mission_ledger.sql
      - supabase/tests/factory_mission_ledger.sql
      - .github/workflows/factory-mission-ledger-sql.yml

permissions:
  contents: read

jobs:
  postgres-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply the additive migration and exercise mission lifecycle RPCs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/tests/factory_mission_ledger.sql
