name: MerKora catalogue foundation checks

on:
  push:
    branches:
      - feature/merkora-catalogue-foundation
  pull_request:
    branches:
      - feature/merkora-gdj-homepage-refinement
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: merkora-catalogue-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
