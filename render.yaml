services:
  - type: worker
    name: merkora-gdj-factory-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: feature/merkora-integration-reconciliation
    buildCommand: npm install
    startCommand: node scripts/factory-worker.mjs
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        value: https://tvwkickjtqjqwoiidmxj.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MERKORA_WORKER_POLL_MS
        value: "30000"
